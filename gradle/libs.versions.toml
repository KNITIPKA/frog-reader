[versions]
agp = "9.3.1"
# Kotlin version for compiler plugins (Compose, serialization).
# Must stay in sync with the Kotlin bundled in AGP (AGP 9.2 ships KGP 2.3.10).
kotlin = "2.3.10"
composeBom = "2026.06.00"
# Newer than the BOM's 1.4.0 on purpose: Material 3 Expressive APIs
# (MaterialExpressiveTheme, MaterialShapes, flexible app bars…) are public here.
material3 = "1.5.0-alpha22"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
iconsExtended = "1.7.8"
kotlinxSerializationJson = "1.9.0"
jsoup = "1.21.1"
coil = "3.2.0"
coreSplashscreen = "1.0.1"
navigationCompose = "2.9.0"
datastore = "1.1.7"
glance = "1.1.1"
work = "2.10.5"
documentfile = "1.1.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "iconsExtended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
# Pure-Java Brotli decoder (Google) — needed for WOFF2 fonts inside EPUB/AZW3.
brotli-dec = { group = "org.brotli", name = "dec", version = "0.1.2" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
# Already on the classpath through Glance, which schedules widget updates with
# it. Declared explicitly because the scheduled backup uses it directly, and
# depending on a transitive dependency breaks the day the transitive path goes.
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# DocumentFile is how a tree Uri from the folder picker is listed and written to.
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kxml2 = { group = "net.sf.kxml", name = "kxml2", version = "2.3.0" }
xmlpull = { group = "xmlpull", name = "xmlpull", version = "1.1.3.1" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
