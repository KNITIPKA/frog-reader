[package]
name = "frogreader-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "frogreader_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled for host JNI tests only. Android artifacts must not enable this.
test-hooks = []

[dependencies]
jni = "=0.21.1"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
crc32fast = "=1.5.0"
zip = { version = "=9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false, features = ["escape-html"] }
cssparser = { version = "=0.38.0", default-features = false }
selectors = "=0.41.0"
precomputed-hash = "=0.1.1"
html5ever = "=0.40.1"
encoding_rs = "=0.8.35"
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
brotli-decompressor = { version = "=6.4.0", default-features = false, features = ["std"] }
memchr = "=2.8.3"
